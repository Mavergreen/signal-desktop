name: release

# mavericks-signal-desktop is a Porthole PRESET that PORTS Signal-Desktop, so it is versioned
# <signal-version>-mavericks.N (UPSTREAM_VERSION = the Signal-Desktop version, Renovate-tracked;
# the container floats to latest at first launch, so the version names the release rather than
# hard-pinning apt). The shipped .pkg is tiny -- just the preset conf + install scripts -- so this
# only stages it (no compiler, no viewer, no container). Three entry points:
#   - push to main        : build + gate; if UPSTREAM_VERSION has no release yet, auto-cut -mavericks.1
#   - a *-mavericks.* tag  : publish that exact version
#   - workflow_dispatch(local_release=true) : cut a -mavericks.(N+1) repackage

on:
  push:
    branches: [main]
    tags: ['*-mavericks.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) repackage for the current Signal version"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # pkgbuild/productbuild are macOS-only (the payload is arch-independent)
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # -mavericks.N counts existing tags

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SIG_DIST_DIR=$RUNNER_TEMP/mm-build/signal-desktop/dist" >> "$GITHUB_ENV"

      - name: Decide version + whether this run publishes
        id: ver
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VER="$GITHUB_REF_NAME"; PUB=true
          else
            MODE=auto
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              MODE=local
            fi
            OUT="$(sh build/version.sh "$MODE")"
            VER="$(printf '%s\n' "$OUT" | sed -n 's/^FULL=//p')"
            REL="$(printf '%s\n' "$OUT" | sed -n 's/^RELEASE=//p')"
            [ "$GITHUB_REF_NAME" = main ] || REL=no
            [ "$REL" = yes ] && PUB=true || PUB=false
          fi
          { echo "version=$VER"; echo "publish=$PUB"; } >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUB"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Build the preset .pkg
        run: |
          set -eu
          sh packaging/macos/build_pkg.sh "${{ steps.ver.outputs.version }}" \
             "$SIG_DIST_DIR/mavericks-signal-desktop-${{ steps.ver.outputs.version }}.pkg"

      # publish-release.yml uses dist/RELEASE_NOTES.md as the Release body (and fails on an empty
      # one). --min-os must say what the pkg declares (packaging/macos/distribution.xml).
      - name: Generate release notes
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.version }}" --version "${{ steps.ver.outputs.version }}" \
            --product 'Linux Signal Desktop' --min-os 10.9.5 --out "$SIG_DIST_DIR/RELEASE_NOTES.md"

      # Conformance: does the pkg we are about to publish carry the family's identity, install paths,
      # floor and version scheme (INGREDIENTS.md "Conformance deviations" excuses the rest)?
      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$SIG_DIST_DIR" "${{ steps.ver.outputs.version }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: signal-desktop
          path: ${{ env.SIG_DIST_DIR }}/*

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: signal-desktop
