# Signal app-specific viewer manifest (shell KEY=value; sourced by bin/generate-viewer).
APP='Signal Desktop'
NAME=
SLUG=signal
PORT=10001
BASE_IMAGE=debian:13-slim

# Third-party apt repo (Signal ships its own). Empty APT_KEY_URL => base-distro app.
APT_KEY_URL=https://updates.signal.org/desktop/apt/keys.asc
APT_REPO='deb [arch=amd64 signed-by=/usr/share/keyrings/signal-desktop-keyring.gpg] https://updates.signal.org/desktop/apt xenial main'
APT_LIST=signal-xenial   # basename of /etc/apt/sources.list.d/<APT_LIST>.list
APT_PKGS=signal-desktop

# The in-container app binary + flags. --password-store pins Electron's key store to the
# container's gnome-keyring: Signal keeps its database key there, and left to guess from the
# desktop (xpra's "Xpra"), Electron picks a backend that can't read it.
APP_BIN=signal-desktop
APP_FLAGS='--no-sandbox --password-store=gnome-libsecret'

# Runtime user + where the app keeps its per-user data (persisted volume mount).
USER=signal
DATADIR=/home/signal/.config/Signal
ICON_GLOB=/usr/share/icons/hicolor/512x512/apps/signal-desktop.png
# The app icon, fetched from Signal by your Mac at install (Porthole never ships it). Any size; a
# larger one from the app's own container replaces it after the first launch if it's bigger.
ICON_URL=https://raw.githubusercontent.com/signalapp/Signal-Desktop/main/build/icons/png/1024x1024.png

# Lifecycle: ondemand (stop the container when the viewer quits) or stayup.
LIFECYCLE=ondemand

# Bridges / capabilities.
AUDIO=yes
PRINTING=
PTRACE=
DARK_THEME=
OPEN_URL=yes
FILE_TRANSFER=yes
NOTIFICATIONS=yes
UPDATE=float   # no version pin (doctrine slice C)
